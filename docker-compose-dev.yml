name: darkmoon-stack

networks:
  control:
    internal: true
  egress:

services:
  darkmoon:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: ascit/darkmoon:local
    container_name: darkmoon
    user: "0:0"
    network_mode: host
    environment:
      DM_MODE: default
    ports:
      - "9222:9222"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube:/root/.kube:ro
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: darkmoon-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EXEC: "1"
      POST: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control

  darkmoon-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: ascit/darkmoon-mcp:local
    container_name: darkmoon-mcp
    restart: unless-stopped
    depends_on:
      darkmoon:
        condition: service_started
      docker-proxy:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_CONTAINER_NAME: darkmoon
      DARKMOON_MCP_HOST: 0.0.0.0
      DARKMOON_MCP_PORT: "8000"
      DARKMOON_MCP_PATH: /mcp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DARKMOON_REPORTS_DIR:-./reports}:/root/.local/share/opencode/reports:rw
      - ${DARKMOON_SESSIONS_DIR:-./sessions}:/root/.local/share/opencode/sessions:rw
      - ${DARKMOON_WORKFLOWS_DIR:-./workflows}:/opt/darkmoon/mcp/server/src/tools/workflows:rw
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 12
    networks:
      - control
      - egress

  opencode-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    image: ascit/darkmoon-opencode-bootstrap:local
    container_name: darkmoon-opencode-bootstrap
    restart: "no"
    network_mode: none
    env_file:
      - ${OPENCODE_ENV_FILE:-./.opencode.env}
    environment:
      DARKMOON_UID: ${DARKMOON_UID:-0}
      DARKMOON_GID: ${DARKMOON_GID:-0}
      DARKMOON_MCP_TRANSPORT: remote
      DARKMOON_MCP_URL: http://darkmoon-mcp:8000/mcp
      OPENCODE_CONFIG_DIR: /config
      OPENCODE_DATA_DIR: /data
      OPENCODE_AGENTS_DIR: /config/agents
      DARKMOON_WORKFLOWS_DIR: /workflows
    volumes:
      - ${DARKMOON_SETTINGS_DIR:-./darkmoon-settings}:/config:rw
      - ${DARKMOON_SETTINGS_DIR:-./darkmoon-settings}/data:/data:rw
      - ${DARKMOON_WORKFLOWS_DIR:-./workflows}:/workflows:rw

  opencode:
    image: ghcr.io/anomalyco/opencode:1.18.12
    container_name: opencode
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      opencode-bootstrap:
        condition: service_completed_successfully
      darkmoon-mcp:
        condition: service_healthy
    env_file:
      - ${OPENCODE_ENV_FILE:-./.opencode.env}
    environment:
      DARKMOON_MCP_URL: http://darkmoon-mcp:8000/mcp
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      TERM: xterm-256color
      LANG: C.UTF-8
    volumes:
      - ${DARKMOON_SETTINGS_DIR:-./darkmoon-settings}:/root/.config/opencode:rw
      - ${DARKMOON_SETTINGS_DIR:-./darkmoon-settings}/data:/root/.local/share/opencode:rw
      - ./conf/plugins:/root/.config/opencode/plugins:ro
      - ${DARKMOON_REPORTS_DIR:-./reports}:/root/.local/share/opencode/reports:rw
      - ${DARKMOON_SESSIONS_DIR:-./sessions}:/root/.local/share/opencode/sessions:rw
      - ${DARKMOON_WORKSPACE_DIR:-./workspace}:/workspace:rw
    networks:
      - control
      - egress
