name: Splunk native harness prerequisites and preserved offline contracts
on:
  push:
    branches: [pro, agent/splunk-native-verification-20261028]
    paths:
      - 'integrations/upstream/splunk/**'
      - '.github/workflows/splunk-native-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness-and-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Preserve all existing Python/loopback/package contracts and new boundary cases
        run: python -m unittest discover -s integrations/upstream/splunk/test -p 'test_*.py' -v
      - name: Preserve all existing JS setup rotation contracts
        run: node --test integrations/upstream/splunk/test/setup_contract.cjs
      - name: Preserve all seven legacy alert guard assertions
        run: python integrations/upstream/splunk/test/test_alert_action.py
      - name: Verify native acceptance sources parse (not an emulator pass)
        run: |
          python -m py_compile integrations/upstream/splunk/test/native_acceptance.py integrations/upstream/splunk/test/native_fixture.py integrations/upstream/splunk/test/native_action.py
          node --check integrations/upstream/splunk/test/native_browser.cjs
      - name: Require missing host prerequisites to remain UNAVAILABLE (not green native)
        shell: bash
        run: |
          set +e
          python integrations/upstream/splunk/test/native_acceptance.py --native > /tmp/dm-native-preflight.out 2>&1
          code=$?
          set -e
          cat /tmp/dm-native-preflight.out
          test "$code" -eq 3 || { echo 'Native host gate did not fail unavailable'; exit 1; }
          echo 'Offline harness contract passed; NATIVE HOST: UNAVAILABLE'
