name: Community native integration validation
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'mcp/community/**'
      - 'integrations/upstream/n8n/**'
      - 'tests/community/n8n_host_acceptance.cjs'
      - 'tests/community/n8n_trigger_host.cjs'
      - 'tests/community/Dockerfile.n8n-host*'
      - 'tests/community/n8n_contract.cjs'
      - 'tests/community/n8n_receiver.cjs'
      - 'tests/community/browser_fixture.py'
      - '.github/workflows/community-integrations.yml'
permissions:
  contents: read
jobs:
  n8n-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build isolated native host image
        run: docker build --file tests/community/Dockerfile.n8n-host --tag darkmoon-n8n-host .
      - name: Test contracts without external traffic
        run: |
          docker run --rm --network none darkmoon-n8n-host sh -c 'npm --prefix integrations/upstream/n8n test && node tests/community/n8n_receiver.cjs && node tests/community/n8n_contract.cjs'
      - name: Test real host workflow, credentials and restart lifecycle offline
        run: docker run --rm --network none darkmoon-n8n-host
