name: Remove reconciled branch refs

on:
  push:
    branches: [pro]
    paths: ['.github/workflows/reconcile-branch-cleanup.yml']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: reconcile-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'newrecycle/Dark-Moon' && github.ref == 'refs/heads/pro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only unchanged reconciled refs with atomic leases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          repo = os.environ['GITHUB_REPOSITORY']
          snapshot = json.loads(Path('docs/handoff/branch-reconciliation-2026-10-28.json').read_text())
          assert repo == snapshot['repository'] == 'newrecycle/Dark-Moon'
          assert os.environ['GITHUB_REF'] == 'refs/heads/pro'
          assert run('gh', 'api', f'repos/{repo}', '--jq', '.default_branch') == 'pro'
          branches = snapshot['branches']
          assert len(branches) == 14 and 'pro' not in branches
          for branch in branches:
              subprocess.run(['git', 'check-ref-format', 'refs/heads/' + branch], check=True)
          live = {ref.removeprefix('refs/heads/'): sha for sha, ref in
                  (line.split() for line in run('git', 'ls-remote', '--heads', 'origin').splitlines())}
          assert live['pro'] == os.environ['GITHUB_SHA'], 'pro advanced; inspect before retry'
          pages = json.loads(run('gh', 'api', '--paginate', '--slurp',
                                 f'repos/{repo}/pulls?state=open&per_page=100'))
          for page in pages:
              for pr in page:
                  if pr['base']['ref'] in branches:
                      raise RuntimeError(f"PR #{pr['number']} still targets a cleanup branch")
                  head_repo = (pr['head'].get('repo') or {}).get('full_name')
                  if head_repo == repo and pr['head']['ref'] in branches:
                      raise RuntimeError(f"PR #{pr['number']} still uses a cleanup branch")
          pending = {}
          for branch, expected in branches.items():
              if branch not in live:
                  print(f'Already removed: {branch}')
                  continue
              assert live[branch] == expected, f'Branch changed: {branch}'
              subprocess.run(['git', 'merge-base', '--is-ancestor', expected,
                              os.environ['GITHUB_SHA']], check=True)
              pending[branch] = expected
          if pending:
              # Leases protect concurrent branch updates; atomic mode prevents
              # partially deleting this snapshot if any ref is rejected.
              leases = [f'--force-with-lease=refs/heads/{b}:{sha}' for b, sha in pending.items()]
              deletes = [f':refs/heads/{b}' for b in pending]
              subprocess.run(['git', 'push', '--atomic', *leases, 'origin', *deletes], check=True)
          remaining = run('git', 'ls-remote', '--heads', 'origin').splitlines()
          names = {line.split()[1].removeprefix('refs/heads/') for line in remaining}
          assert not names.intersection(branches), 'Cleanup refs remain'
          print(f'All {len(branches)} reconciled branch refs removed; pro preserved.')
          PY
