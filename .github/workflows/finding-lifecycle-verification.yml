name: Finding lifecycle verification
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'mcp/api/json_storage.py'
      - 'mcp/api/live_push.py'
      - 'mcp/community/api.py'
      - 'mcp/community/finding_lifecycle.py'
      - 'mcp/community/service.py'
      - 'mcp/community/static/app.js'
      - 'tests/community/test_finding_lifecycle.py'
      - 'tests/community/test_finding_history_bounded.py'
      - 'tests/community/test_community.py'
      - 'tests/community/browser_acceptance.cjs'
      - '.github/workflows/finding-lifecycle-verification.yml'
permissions:
  contents: read
jobs:
  offline-lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install fork test requirements (no licensed runtime)
        run: python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Verify syntax of lifecycle implementation and browser consumer
        run: |
          python -m py_compile mcp/api/json_storage.py mcp/api/live_push.py mcp/community/finding_lifecycle.py mcp/community/api.py mcp/community/service.py tests/community/test_finding_lifecycle.py tests/community/test_finding_history_bounded.py
          node --check mcp/community/static/app.js
          node --check tests/community/browser_acceptance.cjs
      - name: Run offline finding lifecycle API and storage tests
        env:
          PYTHONPATH: mcp
        run: python -m pytest tests/community/test_finding_lifecycle.py -v
      - name: Verify bounded finding history, concurrency and retained memory
        env:
          PYTHONPATH: mcp
        run: python -m pytest tests/community/test_finding_history_bounded.py -v -s
