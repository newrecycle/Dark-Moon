name: Campaign isolation regressions
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'mcp/**'
      - 'conf/**'
      - 'tests/community/**'
      - '.github/workflows/campaign-regressions.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'conf/**'
      - 'tests/community/**'
      - '.github/workflows/campaign-regressions.yml'
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Verify credential discovery and consumer authorization offline
        env:
          PYTHONPATH: mcp
        run: python -m pytest tests/community/test_credential_discovery.py -q
      - name: Test campaign isolation and existing behavior
        env:
          PYTHONPATH: mcp
        run: python -m pytest mcp/tests tests/community -q
      - name: Test native campaign binding and graph controller
        run: |
          node tests/community/campaign_binding.cjs
          node tests/community/graph_navigation.cjs
          node tests/community/finding_query.cjs
