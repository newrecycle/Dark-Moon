name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend and policy test dependencies
        run: python -m pip install pytest PyYAML -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Run all MCP and community regressions once
        env:
          PYTHONPATH: mcp
        run: python -m pytest mcp/tests tests/community -q
      - name: Verify campaign binding and pure browser logic
        run: |
          node tests/community/campaign_binding.cjs
          node tests/community/graph_navigation.cjs
          node tests/community/finding_query.cjs
          node tests/community/resource_routes.cjs
          node tests/community/campaign_window.cjs
          for source in mcp/community/static/*.js; do node --check "$source"; done
