name: Webhook offline verification
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'mcp/community/api.py'
      - 'mcp/community/operations.py'
      - 'mcp/community/store.py'
      - 'mcp/community/auth.py'
      - 'mcp/community/server.py'
      - 'tests/community/test_webhook_delivery_contract.py'
      - 'tests/community/test_webhook_tls_loopback.py'
      - 'integrations/upstream/n8n/**'
      - 'tests/community/n8n_receiver.cjs'
      - 'tests/community/n8n_contract.cjs'
      - 'tests/community/test_webhook_receipts.py'
      - '.github/workflows/webhook-verification.yml'
permissions:
  contents: read
jobs:
  webhook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install fork test dependencies
        run: python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Verify loopback REST, queue, receipt, mock TLS/DNS safety
        env:
          PYTHONPATH: mcp
        run: python -m pytest tests/community/test_webhook_delivery_contract.py tests/community/test_webhook_receipts.py tests/community/test_webhook_tls_loopback.py -q

  n8n-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install n8n package from pinned lockfile
        run: npm --prefix integrations/upstream/n8n ci --ignore-scripts
      - name: Compile n8n nodes and run unit tests
        run: |
          npm --prefix integrations/upstream/n8n run build
          npm --prefix integrations/upstream/n8n test
      - name: Verify signed synthetic receiver admission and replay
        run: |
          node tests/community/n8n_receiver.cjs
          node tests/community/n8n_contract.cjs
