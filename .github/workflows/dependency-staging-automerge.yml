name: Merge validated Dependabot dependency PRs

# Runs with a write token ONLY on workflow_run from the default branch.
# Never check out or execute code supplied by the PR.
on:
  workflow_run:
    workflows: [Dependency staging validation]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependency-staging-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify exact PR, wait for checks, and merge with SHA guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
          origin="$(jq -r '.workflow_run.head_repository.full_name' "$GITHUB_EVENT_PATH")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ || "$origin" != "$GITHUB_REPOSITORY" ]]; then
            echo '::error::Validation did not run for a same-repository commit.'
            exit 1
          fi

          # Dependabot workflow_run events may omit pull_requests. Find exactly
          # one still-open PR by SHA and author, on the two allowed base branches.
          pr="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.sha == \"$sha\" and (.base.ref == \"deps\" or .base.ref == \"pro\") and .user.login == \"dependabot[bot]\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number")"
          if [[ -z "$pr" ]]; then
            echo 'No open matching Dependabot PR; ignoring stale/closed run.'
            exit 0
          fi
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo '::error::More than one matching PR (or invalid number).'
            exit 1
          fi

          detail="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr")"
          base="$(jq -r '.base.ref' <<<"$detail")"
          actual_sha="$(jq -r '.head.sha' <<<"$detail")"
          author="$(jq -r '.user.login' <<<"$detail")"
          draft="$(jq -r '.draft' <<<"$detail")"
          [[ ( "$base" == 'deps' || "$base" == 'pro' ) &&
             "$actual_sha" == "$sha" &&
             "$author" == 'dependabot[bot]' &&
             "$draft" == 'false' ]] || {
            echo '::error::PR changed after validation, or was converted to draft.'
            exit 1
          }

          if [[ "$base" == 'pro' ]]; then
            # Routine version updates target deps in dependabot.yml. Security
            # PRs targeting pro carry this bot-generated security notice.
            # Fail closed if a differently configured version PR targets pro.
            if [[ "$(jq -r '.body // ""' <<<"$detail")" != *"You can disable automated security fix PRs for this repo"* ]]; then
              echo "::warning::PR #$pr targets pro but is not identifiable as a Dependabot security fix. Manual review required."
              exit 0
            fi
          fi

          # Successful dedicated validation is necessary, but not sufficient:
          # wait for ALL of the PR's other CI checks, including independent
          # integration tests. One failure blocks the merge.
          gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10

          # Re-read identity after waiting. SHA guard also protects the merge API
          # from a concurrent Dependabot rebase or new commits.
          detail="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr")"
          [[ "$(jq -r '.state' <<<"$detail")" == 'open' &&
             "$(jq -r '.base.ref' <<<"$detail")" == "$base" &&
             "$(jq -r '.head.sha' <<<"$detail")" == "$sha" &&
             "$(jq -r '.user.login' <<<"$detail")" == 'dependabot[bot]' &&
             "$(jq -r '.draft' <<<"$detail")" == 'false' ]] || {
            echo '::error::PR changed while checks were running. Refusing merge.'
            exit 1
          }

          if [[ "$base" == 'pro' ]]; then
            if [[ "$(jq -r '.body // ""' <<<"$detail")" != *"You can disable automated security fix PRs for this repo"* ]]; then
              echo '::error::Security identification changed while checks were running.'
              exit 1
            fi
          fi

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/$pr/merge" \
            -f sha="$sha" -f merge_method=squash \
            -f commit_title="chore(deps): merge verified Dependabot PR #$pr"

          if [[ "$base" == 'pro' ]]; then
            # Security update is now on pro. Incorporate it into deps without
            # force-pushing or discarding any unpromoted version updates.
            # GitHub's server-side branch merge preserves both histories.
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/merges" \
              -f base=deps -f head=pro \
              -f commit_message="chore(deps): incorporate verified security update from pro"; then
              echo '::warning::Security update merged into pro, but syncing deps failed (possibly a conflict). The scheduled sync will retry; inspect Sync pro into deps.'
            fi
          else
            # Keep the existing deps -> pro PR as a MANUAL promotion control.
            existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=pro&per_page=100" \
              --jq ".[] | select(.head.ref == \"deps\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number")"
            if [[ -z "$existing" ]]; then
              if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
                -f base=pro -f head=deps \
                -f title='chore(deps): promote staged dependency updates into pro' \
                -f body='Routine Dependabot updates are staged on deps. Review the diff and CI, then merge manually when ready. Security fixes targeting pro are merged separately after validation.' >/dev/null; then
                echo '::warning::deps updated, but opening the manual promotion PR failed. Use the compare link in docs/dependency-maintenance.md.'
              fi
            fi
          fi
