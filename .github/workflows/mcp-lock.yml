name: MCP dependency lock

on:
  pull_request:
    paths:
      - mcp/requirements.in
      - mcp/requirements.lock
      - .github/workflows/mcp-lock.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lock:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Generate hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check pip==25.3 pip-tools==7.5.2
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file generated-requirements.lock \
            mcp/requirements.in

      - name: Upload generated lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-mcp-lock
          path: generated-requirements.lock
          if-no-files-found: ignore

      - name: Verify committed effective lock
        run: |
          # pip ignores comments and blank lines. Compare every effective pinned
          # requirement, continuation line, and SHA-256 hash exactly while
          # allowing pip-tools to update explanatory "via" comments.
          grep -Ev '^[[:space:]]*(#|$)' mcp/requirements.lock > committed-effective.lock
          grep -Ev '^[[:space:]]*(#|$)' generated-requirements.lock > generated-effective.lock
          diff -u committed-effective.lock generated-effective.lock
