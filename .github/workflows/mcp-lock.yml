name: MCP dependency lock

on:
  pull_request:
    paths:
      - mcp/requirements.in
      - mcp/requirements.lock
      - .github/workflows/mcp-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcp-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Generate hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check pip==25.3 pip-tools==7.5.2
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file generated-requirements.lock \
            mcp/requirements.in

      - name: Commit generated lock for this same-repository PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! cmp -s mcp/requirements.lock generated-requirements.lock; then
            cp generated-requirements.lock mcp/requirements.lock
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add mcp/requirements.lock
            git commit -m "build(mcp): update hash-locked dependencies"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload generated lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-mcp-lock
          path: generated-requirements.lock
          if-no-files-found: ignore

      - name: Verify committed lock
        run: diff -u mcp/requirements.lock generated-requirements.lock
