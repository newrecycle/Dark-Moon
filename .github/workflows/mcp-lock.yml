name: MCP dependency lock

on:
  pull_request:
    paths:
      - mcp/requirements.in
      - mcp/requirements.lock
      - .github/workflows/mcp-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Generate hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.5.2
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file generated-requirements.lock \
            mcp/requirements.in

      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-mcp-lock
          path: generated-requirements.lock

      - name: Verify committed lock
        run: diff -u mcp/requirements.lock generated-requirements.lock
