name: Grafana integration verification
on:
  push:
    branches: [pro]
    paths:
      - 'integrations/upstream/grafana/**'
      - '.github/workflows/grafana-integration-verification.yml'
  pull_request:
    paths:
      - 'integrations/upstream/grafana/**'
      - '.github/workflows/grafana-integration-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/upstream/grafana/plugin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/upstream/grafana/plugin/go.mod
          cache-dependency-path: integrations/upstream/grafana/plugin/go.sum
      - name: Check formatting
        run: |
          test -z "$(gofmt -l pkg/plugin/*.go pkg/models/*.go pkg/main.go)"
      - name: Backend tests (including race safety)
        run: go test -race ./pkg/...
      - name: Compile backend
        run: go build ./pkg/...
      - name: Build packaged binary in nested datasource
        run: |
          go run github.com/magefile/mage -v build:linux
          test -x dist/datasource/gpx_darkmoon_linux_amd64
          test -f dist/datasource/plugin.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/upstream/grafana/plugin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/upstream/grafana/plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test:ci -- --watch=false
      - name: Build frontend with managed webpack configuration
        run: npm run build
      - name: Verify nested datasource assets
        run: |
          test -f dist/plugin.json
          test -f dist/datasource/plugin.json
          test -f dist/datasource/img/logo.svg
