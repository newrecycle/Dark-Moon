name: Finding history durability and indexing
on:
  workflow_dispatch:
  push:
    branches:
      - pro
      - work/finding-history-durability-20261028
    paths:
      - 'mcp/api/json_storage.py'
      - 'mcp/api/finding_history_sqlite.py'
      - 'mcp/api/live_push.py'
      - 'mcp/community/finding_lifecycle.py'
      - 'mcp/community/service.py'
      - 'tests/community/test_finding_history*'
      - 'tests/community/test_finding_lifecycle.py'
      - 'tools/finding-history-admin.py'
      - '.github/workflows/finding-history-durability.yml'
permissions:
  contents: read
jobs:
  durability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test requirements
        run: python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Compile durability implementation and test sources
        run: |
          python -m py_compile mcp/api/json_storage.py mcp/api/finding_history_sqlite.py mcp/api/live_push.py mcp/community/service.py mcp/community/finding_lifecycle.py tests/community/test_finding_lifecycle.py tests/community/test_finding_history_bounded.py tests/community/test_finding_history_durable.py tools/finding-history-admin.py
      - name: Run focused lifecycle, bounded-history and crash-recovery tests with measurements
        env:
          PYTHONPATH: mcp
        run: python -m pytest tests/community/test_finding_lifecycle.py tests/community/test_finding_history_bounded.py tests/community/test_finding_history_durable.py -v -s
      - name: Run affected full Python regression suite
        env:
          PYTHONPATH: mcp
        run: python -m pytest mcp/tests tests/community -q
