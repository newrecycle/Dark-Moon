name: Core path and event contract verification
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'mcp/community/attack_paths.py'
      - 'mcp/community/operations.py'
      - 'mcp/community/remediation.py'
      - 'mcp/community/api.py'
      - 'mcp/community/evidence_access.py'
      - 'mcp/community/static/paths.js'
      - 'tests/community/test_attack_paths.py'
      - 'tests/community/test_core_contract_boundaries.py'
      - 'tests/community/path_revision*'
      - '.github/workflows/core-path-contract-verification.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
          npm install --prefix /tmp/darkmoon-path-browser playwright
          /tmp/darkmoon-path-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify paths, event identities and remediation boundaries offline
        env:
          PYTHONPATH: mcp:tests/community
        run: |
          python -m pytest tests/community/test_attack_paths.py tests/community/test_core_contract_boundaries.py -q
          node --check mcp/community/static/paths.js
          node --check tests/community/path_revision_browser.cjs
      - name: Verify actual path component and production HTTP policy in Chromium
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/darkmoon-path-browser/node_modules
          DARKMOON_SCREENSHOTS: path-browser-screenshots
        run: node tests/community/path_revision_browser.cjs
      - name: Preserve fixture component screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-path-browser-screenshots
          path: path-browser-screenshots/
          if-no-files-found: warn
