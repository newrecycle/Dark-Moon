name: Docker and MCP compatibility

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration-and-plugin:
    name: Configuration and plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install configuration test dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run configuration regressions
        run: python -m unittest -v tests.test_opencode_config

      - name: Compile MCP HTTP entrypoint
        run: python -m py_compile mcp/src/http_server.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test compatibility plugin
        run: node --test tests/test_darkmoon_compat.mjs

      - name: Run repository invariant gate
        run: bash tools/check-no-regression.sh

  docker-and-mcp:
    name: Stock OpenCode and MCP sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker environment
        run: |
          docker version
          docker compose version
          docker info

      - name: Test Docker, MCP, provider boundary, and restart
        run: bash tests/test_docker_mcp.sh
