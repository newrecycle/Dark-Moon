name: Credential access and adapter verification
on:
  workflow_dispatch:
  push:
    branches: [agent/credential-adapters-access-20261028, pro]
    paths:
      - 'mcp/community/auth.py'
      - 'mcp/community/credential_policy.py'
      - 'mcp/community/credential_catalog.py'
      - 'mcp/community/credential_launch.py'
      - 'mcp/community/source_checkout.py'
      - 'mcp/community/jobs.py'
      - 'mcp/community/service.py'
      - 'mcp/community/api.py'
      - 'mcp/community/server.py'
      - 'mcp/community/configuration.py'
      - 'mcp/community/provider_checks.py'
      - 'mcp/community/opencode.py'
      - 'tests/community/test_credential_*.py'
      - '.github/workflows/credential-access-validation.yml'
permissions:
  contents: read
concurrency:
  group: credential-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  credential-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Focused offline credential and consumer contracts
        env:
          PYTHONPATH: mcp
        run: |
          python -m pytest tests/community/test_credential_access.py tests/community/test_credential_discovery.py tests/community/test_provider_management.py tests/community/test_pro_features.py -q

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Full offline community regression
        env:
          PYTHONPATH: mcp
        run: python -m pytest mcp/tests tests/community -q
