name: Run discovery and log safety verification

on:
  push:
    branches: [pro]
    paths:
      - 'tests/community/test_run_discovery.py'
      - 'tests/community/test_pro_contract_aliases.py'
      - 'mcp/community/run_views.py'
      - 'mcp/community/api.py'
      - 'mcp/community/jobs.py'
      - 'mcp/community/server.py'
      - 'mcp/community/service.py'
      - 'mcp/community/store.py'
      - 'mcp/community/static/app.js'
      - '.github/workflows/run-discovery-verification.yml'
  pull_request:
    paths:
      - 'tests/community/test_run_discovery.py'
      - 'tests/community/test_pro_contract_aliases.py'
      - 'mcp/community/run_views.py'
      - 'mcp/community/api.py'
      - 'mcp/community/jobs.py'
      - 'mcp/community/server.py'
      - 'mcp/community/service.py'
      - 'mcp/community/store.py'
      - 'mcp/community/static/app.js'
      - '.github/workflows/run-discovery-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated offline test dependencies
        run: |
          python -m pip install -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Compile affected Python modules and test files
        run: |
          python -m py_compile mcp/community/run_views.py mcp/community/api.py mcp/community/jobs.py mcp/community/store.py mcp/community/server.py mcp/community/service.py tests/community/test_run_discovery.py tests/community/test_pro_contract_aliases.py
      - name: Parse dashboard JavaScript
        run: node --check mcp/community/static/app.js
      - name: Run offline API, privacy, lifecycle and compatibility regressions
        env:
          PYTHONPATH: mcp
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests/community -p 'test_run_discovery.py' -v
          python -m unittest discover -s tests/community -p 'test_pro_contract_aliases.py' -v
