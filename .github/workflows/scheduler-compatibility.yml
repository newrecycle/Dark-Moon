name: Scheduler compatibility verification
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'mcp/community/api.py'
      - 'mcp/community/jobs.py'
      - 'mcp/community/scheduler_compat.py'
      - 'mcp/community/calendar_rules.py'
      - 'mcp/community/server.py'
      - 'mcp/community/service.py'
      - 'mcp/community/store.py'
      - 'tests/community/test_scheduler_compatibility.py'
      - 'tests/community/test_calendar_scheduling.py'
      - 'tests/community/test_pro_contract_aliases.py'
      - '.github/workflows/scheduler-compatibility.yml'
  pull_request:
    paths:
      - 'mcp/community/api.py'
      - 'mcp/community/jobs.py'
      - 'mcp/community/scheduler_compat.py'
      - 'mcp/community/calendar_rules.py'
      - 'mcp/community/server.py'
      - 'mcp/community/service.py'
      - 'mcp/community/store.py'
      - 'tests/community/test_scheduler_compatibility.py'
      - 'tests/community/test_calendar_scheduling.py'
      - 'tests/community/test_pro_contract_aliases.py'
      - '.github/workflows/scheduler-compatibility.yml'
permissions:
  contents: read
jobs:
  scheduler-adapter:
    name: Offline scheduler input and calendar contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install fork test dependencies
        run: python -m pip install pytest -r mcp/requirements.txt -r mcp/community/requirements.txt
      - name: Verify flat adapter, calendar behavior and PUT/PATCH contracts
        env:
          PYTHONPATH: mcp
        run: >
          python -m pytest -q
          tests/community/test_scheduler_compatibility.py
          tests/community/test_calendar_scheduling.py
          tests/community/test_pro_contract_aliases.py
