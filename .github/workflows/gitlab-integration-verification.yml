name: GitLab generated component and native runner acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - pro
    paths:
      - 'integrations/upstream/gitlab/**'
      - 'tests/community/gitlab_contract.py'
      - '.github/workflows/gitlab-integration-verification.yml'
permissions:
  contents: read
jobs:
  generated-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python test dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Verify generated source is identical to shipped component
        run: |
          cd integrations/upstream/gitlab
          cp templates/scan/template.yml /tmp/darkmoon-gitlab-shipped.yml
          python build/render_template.py
          cmp -s templates/scan/template.yml /tmp/darkmoon-gitlab-shipped.yml
          python -c 'import yaml; a=list(yaml.safe_load_all(open("templates/scan/template.yml"))); assert len(a)==2 and "spec" in a[0] and "script" in next(iter(a[1].values()))'
      - name: Validate pinned SAST schema and mapper
        run: |
          cd integrations/upstream/gitlab
          python test/check_schema_pin.py
          python test/unit_tests.py
      - name: Exercise generated job error and identity matrix
        run: |
          python integrations/upstream/gitlab/test/job_acceptance.py
          python tests/community/gitlab_contract.py
  legacy-native-runner:
    needs: generated-and-schema
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python schema validators
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Build fork-patched CLI instead of using an unrelated global package
        run: |
          npm --prefix integrations/upstream/client ci
          npm --prefix integrations/upstream/client run build
          node integrations/upstream/client/dist/cli/darkmoon-ci.cjs --help
      - name: Download isolated GitLab Runner 15.11.1 for deprecated exec shell
        run: |
          set -eu
          curl -fsSL --retry 3 'https://gitlab-runner-downloads.s3.amazonaws.com/v15.11.1/binaries/gitlab-runner-linux-amd64' -o integrations/upstream/gitlab/test/vendor/gitlab-runner
          chmod 700 integrations/upstream/gitlab/test/vendor/gitlab-runner
          integrations/upstream/gitlab/test/vendor/gitlab-runner --version
      - name: Run actual generated job under historic native Runner shell executor
        run: bash integrations/upstream/gitlab/test/run_runner_e2e.sh
  modern-registered-runner:
    needs: generated-and-schema
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real standalone patched CLI and modern Runner
        run: |
          python -m pip install PyYAML
          npm --prefix integrations/upstream/client ci --ignore-scripts
          npm --prefix integrations/upstream/client run build
          npm install --prefix /tmp/dm-gitlab-builder esbuild@0.25.12
          /tmp/dm-gitlab-builder/node_modules/.bin/esbuild integrations/upstream/client/dist/cli/darkmoon-ci.cjs --bundle --platform=node --format=cjs --outfile=integrations/upstream/gitlab/test/vendor/standalone-client.cjs
          curl -fsSL --retry 3 https://gitlab-runner-downloads.s3.amazonaws.com/v19.5.0/binaries/gitlab-runner-linux-amd64 -o integrations/upstream/gitlab/test/vendor/gitlab-runner-modern
          chmod 700 integrations/upstream/gitlab/test/vendor/gitlab-runner-modern
          integrations/upstream/gitlab/test/vendor/gitlab-runner-modern --version
      - name: Verify acceptance contracts
        run: python -m unittest discover -s integrations/upstream/gitlab/test -p test_server_acceptance.py -v
      - name: Real disposable CE server, registered Runner and artifact acceptance
        run: python integrations/upstream/gitlab/test/server_acceptance.py
