name: Grafana native-host integration
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'integrations/upstream/grafana/**'
      - '.github/workflows/grafana-native-host.yml'
permissions:
  contents: read
concurrency:
  group: grafana-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/upstream/grafana/plugin/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual fork plugin package
        working-directory: integrations/upstream/grafana/plugin
        run: |
          npm ci --ignore-scripts
          npm run build
          go run github.com/magefile/mage -v build:linux
          test -x dist/datasource/gpx_darkmoon_linux_amd64
          test -f dist/datasource/plugin.json
      - name: Boot private fixture and Grafana
        env:
          GRAFANA_ADMIN: offline-test-password-1234
        run: |
          set -euo pipefail
          trap 'docker logs dm-grafana 2>&1 | tail -100 || true; docker rm -f dm-grafana dm-api >/dev/null 2>&1 || true; docker network rm dm-private >/dev/null 2>&1 || true' EXIT
          docker network create --internal dm-private
          docker run -d --name dm-api --network dm-private \
            -v "$PWD/integrations/upstream/grafana/fixtures:/fixture:ro" \
            -e PORT=8080 python:3.12-slim python /fixture/mock_server.py
          cat > "$RUNNER_TEMP/ds.yaml" <<'EOF'
          apiVersion: 1
          datasources:
            - name: Darkmoon Fixture
              type: darkmoon-securityposture-datasource
              uid: darkmoon-fixture
              access: proxy
              jsonData:
                baseUrl: http://dm-api:8080
              secureJsonData:
                darkmoonToken: fixture-only
          EOF
          cat > "$RUNNER_TEMP/app.yaml" <<'EOF'
          apiVersion: 1
          apps:
            - type: darkmoon-securityposture-app
              org_id: 1
              disabled: false
          EOF
          docker run -d --name dm-grafana --network dm-private \
            -p 127.0.0.1:3009:3000 \
            -e GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=darkmoon-securityposture-app,darkmoon-securityposture-datasource \
            -e GF_ANALYTICS_REPORTING_ENABLED=false -e GF_ANALYTICS_CHECK_FOR_UPDATES=false \
            -e GF_SECURITY_ADMIN_USER=admin -e GF_SECURITY_ADMIN_PASSWORD="$GRAFANA_ADMIN" \
            -v "$PWD/integrations/upstream/grafana/plugin/dist:/var/lib/grafana/plugins/darkmoon-securityposture-app:ro" \
            -v "$RUNNER_TEMP/ds.yaml:/etc/grafana/provisioning/datasources/dm.yaml:ro" \
            -v "$RUNNER_TEMP/app.yaml:/etc/grafana/provisioning/plugins/dm.yaml:ro" \
            grafana/grafana:13.1
          # Docker's internal network intentionally blocks host-published ports.
          # Query the real Grafana HTTP API from the adjacent Python fixture only.
          fixture_http() {
            docker exec -i -e FIXTURE_ADMIN="$GRAFANA_ADMIN" dm-api python -c '
          import base64, os, sys, urllib.request
          endpoint = "http://dm-grafana:3000" + sys.argv[1]
          method = sys.argv[2] if len(sys.argv) > 2 else "GET"
          payload = sys.stdin.read().encode() if method == "POST" else None
          headers = {"Accept": "application/json"}
          if sys.argv[1] != "/api/health":
              secret = ("admin:" + os.environ["FIXTURE_ADMIN"]).encode()
              headers["Authorization"] = "Basic " + base64.b64encode(secret).decode()
          if payload is not None: headers["Content-Type"] = "application/json"
          request = urllib.request.Request(endpoint, data=payload, headers=headers, method=method)
          print(urllib.request.urlopen(request, timeout=8).read().decode())
          ' "$@"
          }
          ready=0
          for n in $(seq 1 40); do
            if fixture_http /api/health > "$RUNNER_TEMP/grafana-health.json" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then echo "Grafana did not become healthy on its private network" >&2; exit 1; fi
          fixture_http /api/datasources/uid/darkmoon-fixture > "$RUNNER_TEMP/datasource.json"
          fixture_http /api/plugins > "$RUNNER_TEMP/app.json"
          cat > "$RUNNER_TEMP/query.json" <<'EOF'
          {"from":"1735689600000","to":"1767225600000","queries":[{"refId":"A","datasource":{"uid":"darkmoon-fixture","type":"darkmoon-securityposture-datasource"},"queryType":"retest","retest_id":"retest_demo_1","intervalMs":60000,"maxDataPoints":100}]}
          EOF
          fixture_http /api/ds/query POST < "$RUNNER_TEMP/query.json" > "$RUNNER_TEMP/query-result.json"
          python3 - "$RUNNER_TEMP/datasource.json" "$RUNNER_TEMP/app.json" "$RUNNER_TEMP/query-result.json" <<'PY'
          import json,sys
          ds,app,res=(json.load(open(p)) for p in sys.argv[1:])
          assert ds.get("uid")=="darkmoon-fixture",ds
          plugins = app if isinstance(app, list) else app.get("plugins", [])
          assert any(item.get("id")=="darkmoon-securityposture-app" for item in plugins), plugins
          result=res["results"]["A"]
          assert not result.get("error"),result.get("error")
          frames=result.get("frames",[])
          assert [f["schema"]["name"] for f in frames]==["retest_state","retest"],result
          state=frames[0]["data"]["values"]
          for col,value in [(1,"completed"),(2,"camp_demo_01"),(3,"camp_demo_04"),(4,"tgt_web"),(5,"run_demo_retest")]:
              assert state[col][0]==value,(col,state[col])
          print("PASS: packaged Grafana app, nested datasource and retest lifecycle")
          PY
      - name: Keep nonsecret host metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-host-metadata
          path: |
            ${{ runner.temp }}/grafana-health.json
            ${{ runner.temp }}/app.json
            ${{ runner.temp }}/datasource.json
          if-no-files-found: warn
