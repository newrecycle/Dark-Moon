name: Community SDK and CI contracts
on:
  workflow_dispatch:
  push:
    branches: [pro]
    paths:
      - 'integrations/upstream/client/**'
      - 'integrations/upstream/action/**'
      - 'integrations/upstream/gitlab/**'
      - 'tests/community/client_contract.cjs'
      - 'tests/community/action_host.cjs'
      - 'tests/community/sdk_fork_http.cjs'
      - 'tests/community/client_snapshot.py'
      - 'tests/community/gitlab_contract.py'
      - 'mcp/community/**'
      - '.github/workflows/community-sdk.yml'
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm --prefix integrations/upstream/client ci --ignore-scripts
      - run: npm --prefix integrations/upstream/client run ci
      - run: node tests/community/client_contract.cjs
      - run: python3 tests/community/client_snapshot.py
      - run: npm --prefix integrations/upstream/action ci --ignore-scripts
      - run: npm --prefix integrations/upstream/action run all
      - run: node tests/community/action_host.cjs
      - name: Install fork HTTP dependencies
        run: |
          python3 -m venv /tmp/darkmoon-sdk-env
          /tmp/darkmoon-sdk-env/bin/pip install -r mcp/requirements.txt -r mcp/community/requirements.txt
      - run: DARKMOON_TEST_PYTHON=/tmp/darkmoon-sdk-env/bin/python node tests/community/sdk_fork_http.cjs
      - name: Validate GitLab mapper and shipped job script
        run: |
          /tmp/darkmoon-sdk-env/bin/pip install pyyaml jsonschema
          /tmp/darkmoon-sdk-env/bin/python integrations/upstream/gitlab/test/check_schema_pin.py
          /tmp/darkmoon-sdk-env/bin/python integrations/upstream/gitlab/test/unit_tests.py
          /tmp/darkmoon-sdk-env/bin/python tests/community/gitlab_contract.py
          /tmp/darkmoon-sdk-env/bin/python integrations/upstream/gitlab/build/render_template.py
          git diff --exit-code -- integrations/upstream/gitlab/templates/scan/template.yml
