# Routine updates stage on pro; security updates retain default-branch coverage.
version: 2
updates:
- package-ecosystem: github-actions
  directories: &id001
  - /
  schedule: &id002
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/Edmonton
  target-branch: pro
  open-pull-requests-limit: 2
  groups:
    routine:
      patterns:
      - '*'
  rebase-strategy: auto
- package-ecosystem: github-actions
  directories: *id001
  schedule: *id002
  open-pull-requests-limit: 2
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: pip
  directories: &id003
  - /mcp
  - /mcp/community
  schedule: &id004
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/Edmonton
  target-branch: pro
  open-pull-requests-limit: 2
  groups:
    routine:
      patterns:
      - '*'
  rebase-strategy: auto
- package-ecosystem: pip
  directories: *id003
  schedule: *id004
  open-pull-requests-limit: 2
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  directories: &id005
  - /integrations/upstream/action
  - /integrations/upstream/client
  - /integrations/upstream/n8n
  - /integrations/upstream/vscode
  - /integrations/upstream/grafana/plugin
  schedule: &id006
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/Edmonton
  target-branch: pro
  open-pull-requests-limit: 2
  groups:
    routine:
      patterns:
      - '*'
  rebase-strategy: auto
- package-ecosystem: npm
  directories: *id005
  schedule: *id006
  open-pull-requests-limit: 2
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
