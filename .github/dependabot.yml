# Version and security PRs both target the default branch, pro.
version: 2
updates:
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/Edmonton
  open-pull-requests-limit: 1
  groups:
    routine:
      patterns:
      - '*'
      applies-to: version-updates
    security:
      applies-to: security-updates
      patterns:
      - '*'
  rebase-strategy: auto
- package-ecosystem: pip
  directories:
  - /mcp
  - /mcp/community
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/Edmonton
  open-pull-requests-limit: 1
  groups:
    routine:
      patterns:
      - '*'
      applies-to: version-updates
    security:
      applies-to: security-updates
      patterns:
      - '*'
  rebase-strategy: auto
- package-ecosystem: npm
  directories:
  - /integrations/upstream/action
  - /integrations/upstream/client
  - /integrations/upstream/n8n
  - /integrations/upstream/vscode
  - /integrations/upstream/grafana/plugin
  - /integrations/upstream/jenkins
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/Edmonton
  open-pull-requests-limit: 1
  groups:
    routine:
      patterns:
      - '*'
      applies-to: version-updates
    security:
      applies-to: security-updates
      patterns:
      - '*'
  rebase-strategy: auto
