version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "deps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/mcp"
    target-branch: "deps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    groups:
      python:
        patterns:
          - "*"

