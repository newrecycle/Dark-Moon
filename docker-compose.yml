name: darkmoon-stack

services:
  darkmoon:
    image: ascit/darkmoon:local
    container_name: darkmoon
    user: "0:0"
    network_mode: host
    environment:
      DM_MODE: default
      DARKMOON_EXEC_MODE: local
      DARKMOON_MCP_AUTOSTART: "1"
      DARKMOON_MCP_HOST: 127.0.0.1
      DARKMOON_MCP_PORT: "8000"
      DARKMOON_MCP_PATH: /mcp
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
      - ${DARKMOON_REPORTS_DIR:-./reports}:/root/.local/share/opencode/reports:rw
      - ${DARKMOON_WORKFLOWS_DIR:-./workflows}:/opt/darkmoon/mcp/server/src/tools/workflows:rw
      # Agent personas (read-only): exposed to the MCP as `agent://<name>` resources
      # so a Hermes agent can load the orchestrator/subagent identity via darkmoon_* tools.
      - ./conf/agents:/opt/darkmoon/conf/agents:ro
    cap_add:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "bash", "-lc", "cd /opt/darkmoon/mcp/server && python -m src.healthcheck"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12
    restart: unless-stopped
