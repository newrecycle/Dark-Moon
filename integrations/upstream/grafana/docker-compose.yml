# Darkmoon Grafana integration — reproducible local test lab.
#
#   docker compose up          -> Grafana (latest) + Infinity + Demo Shop mock
#   GRAFANA_TAG=10.4.7 docker compose up   -> pin a specific Grafana version
#
# Grafana comes up with:
#   * the Infinity datasource provisioned (points at the mock)
#   * the Darkmoon Security Posture dashboards provisioned
#   * the Demo Shop mock serving the exact Darkmoon REST shapes on :8080
#
# 100% synthetic data (Demo Shop). No secrets, no real client data.
services:
  darkmoon-mock:
    image: python:3.12-slim
    container_name: darkmoon-mock
    working_dir: /app
    command: python /app/mock_server.py
    environment:
      PORT: "8080"
    volumes:
      - ./fixtures:/app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/health'); "]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    container_name: darkmoon-grafana
    depends_on:
      darkmoon-mock:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: darkmoon-securityposture-app,darkmoon-securityposture-datasource
      # In-lab: point the provisioned dashboards' base URL at the mock.
      DARKMOON_MOCK_URL: http://darkmoon-mock:8080
    ports:
      - "3009:3000"
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      # Lab uses the mock-wired dashboard copy (darkmoon-mock:8080). The shipped
      # dashboards/ point at localhost / your real API instead.
      - ./test/dashboards:/var/lib/grafana/dashboards
