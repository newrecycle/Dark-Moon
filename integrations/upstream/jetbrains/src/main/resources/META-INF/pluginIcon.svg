<?xml version="1.0" encoding="UTF-8"?>
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Darkmoon">
  <defs>
    <linearGradient id="dmGrad" x1="8" y1="6" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#C7D7FF"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded tile -->
  <rect x="1" y="1" width="38" height="38" rx="8" fill="#0B0B14"/>
  <rect x="1.5" y="1.5" width="37" height="37" rx="7.5" fill="none" stroke="#1E1B3A" stroke-width="1"/>
  <!-- Pixel-square crescent moon: full grid minus an offset grid carves the crescent -->
  <g fill="url(#dmGrad)">
    <rect x="14" y="8"  width="5" height="5" rx="1"/>
    <rect x="20" y="8"  width="5" height="5" rx="1"/>
    <rect x="11" y="14" width="5" height="5" rx="1"/>
    <rect x="11" y="20" width="5" height="5" rx="1"/>
    <rect x="11" y="26" width="5" height="5" rx="1"/>
    <rect x="14" y="27" width="5" height="5" rx="1"/>
    <rect x="20" y="27" width="5" height="5" rx="1"/>
  </g>
  <!-- Accent pixels -->
  <rect x="26" y="14" width="3" height="3" rx="0.5" fill="#C7D7FF"/>
  <rect x="30" y="22" width="2.5" height="2.5" rx="0.5" fill="#6366F1"/>
</svg>
