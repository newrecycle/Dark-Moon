group = fr.ascit.darkmoon
version = 0.1.0

pluginRepositoryUrl = https://github.com/ASCIT31/darkmoon-jetbrains

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Configuration cache is disabled: some IntelliJ Platform Gradle Plugin 2.x tasks
# (notably runIde and a few verification wiring paths) are not yet CC-compatible.
org.gradle.configuration-cache = false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
