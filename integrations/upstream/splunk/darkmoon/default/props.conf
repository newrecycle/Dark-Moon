#
# Darkmoon HEC ingestion contract
#
# Darkmoon events arrive via the HTTP Event Collector "event" endpoint as
# structured JSON objects (one safe-field envelope per event). These stanzas
# give each darkmoon:* sourcetype clean line-breaking, timestamping and
# search-time JSON field extraction, plus CIM (Vulnerabilities / Alerts)
# field aliases so the data interoperates with Enterprise Security without
# requiring it.
#
# SAFETY: as a defense-in-depth layer, SEDCMD stanzas below redact anything
# that looks like a bearer token / secret before it is indexed. The producer
# (forwarder / webhook) is the primary guard (safe-field allowlist); this is
# the belt-and-suspenders.
#

[darkmoon]
# Base/fallback sourcetype. Never expected in practice (events are typed).
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = \"ts\"\s*:\s*\"
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Security
description = Darkmoon pentest event (generic)
disabled = false
SEDCMD-dm_redact_bearer = s/(?i)(bearer\s+)[A-Za-z0-9._\-]{8,}/\1[REDACTED]/g
SEDCMD-dm_redact_token = s/(?i)(\"?(?:token|secret|password|api[_-]?key|authorization)\"?\s*[:=]\s*\"?)[^\",\s]{6,}/\1[REDACTED]/g

[darkmoon:campaign]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = \"ts\"\s*:\s*\"
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Security
description = Darkmoon campaign lifecycle event
disabled = false
SEDCMD-dm_redact_bearer = s/(?i)(bearer\s+)[A-Za-z0-9._\-]{8,}/\1[REDACTED]/g
SEDCMD-dm_redact_token = s/(?i)(\"?(?:token|secret|password|api[_-]?key|authorization)\"?\s*[:=]\s*\"?)[^\",\s]{6,}/\1[REDACTED]/g
# CIM: Alerts / general
FIELDALIAS-dm_dest = target AS dest
FIELDALIAS-dm_dest_host = target AS dvc
EVAL-vendor = "Darkmoon"
EVAL-product = "Darkmoon Pentest"
EVAL-app = "darkmoon"

[darkmoon:finding]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = \"ts\"\s*:\s*\"
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Security
description = Darkmoon finding (vulnerability) event
disabled = false
SEDCMD-dm_redact_bearer = s/(?i)(bearer\s+)[A-Za-z0-9._\-]{8,}/\1[REDACTED]/g
SEDCMD-dm_redact_token = s/(?i)(\"?(?:token|secret|password|api[_-]?key|authorization)\"?\s*[:=]\s*\"?)[^\",\s]{6,}/\1[REDACTED]/g
# CIM Vulnerabilities data model mapping
FIELDALIAS-dm_dest = target AS dest
FIELDALIAS-dm_signature = title AS signature
FIELDALIAS-dm_vulnerability_id = cve AS vulnerability_id
FIELDALIAS-dm_cvss = cvss_score AS cvss
FIELDALIAS-dm_signature_id = finding_id AS signature_id
# CIM severity vocabulary uses "informational" not "info"
EVAL-severity = case(severity=="info","informational", severity=="none","informational", true(), severity)
EVAL-vendor = "Darkmoon"
EVAL-product = "Darkmoon Pentest"
EVAL-app = "darkmoon"

