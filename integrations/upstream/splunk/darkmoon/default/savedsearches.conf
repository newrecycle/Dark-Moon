#
# Example correlation / saved searches.
#
# The three searches below are DISABLED by default. Review them, restrict the
# target allowlist (lookups/darkmoon_targets.csv), disable dry_run, then enable.
# The alert action refuses any target not on the allowlist.
#

# 1) Auto-retest when a finding is newly EXPLOITED on an allowlisted target.
[Darkmoon - Exploited finding -> auto retest]
disabled = 1
search = `darkmoon_index` sourcetype=darkmoon:finding event=finding.exploited \
  | lookup darkmoon_targets_lookup target OUTPUT allow_destructive as _allowed \
  | where isnotnull(_allowed) \
  | stats latest(_time) as _time count by target finding_id severity title
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.darkmoon_campaign = 1
action.darkmoon_campaign.param.action_kind = retest
action.darkmoon_campaign.param.scope_profile = non-destructive
action.darkmoon_campaign.param.dry_run = 1
action.darkmoon_campaign.param.max_per_hour = 6
description = When a Darkmoon finding transitions to EXPLOITED on an allowlisted target, launch a validation retest.

# 2) Critical-severity spike -> targeted campaign.
[Darkmoon - Critical severity spike -> campaign]
disabled = 1
search = `darkmoon_index` sourcetype=darkmoon:finding severity=critical \
  | lookup darkmoon_targets_lookup target OUTPUT allow_destructive as _allowed \
  | where isnotnull(_allowed) \
  | bin _time span=1h \
  | stats dc(finding_id) as new_criticals by target _time \
  | where new_criticals >= 3
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.darkmoon_campaign = 1
action.darkmoon_campaign.param.action_kind = campaign
action.darkmoon_campaign.param.scope_profile = non-destructive
action.darkmoon_campaign.param.dry_run = 1
action.darkmoon_campaign.param.max_per_hour = 3
description = When 3+ new criticals land on an allowlisted target within an hour, launch a fresh Darkmoon campaign.

# 3) Regression detected in a retest -> re-validate.
[Darkmoon - Regression verdict -> retest]
disabled = 1
search = `darkmoon_index` sourcetype=darkmoon:retest verdict=regressed \
  | lookup darkmoon_targets_lookup target OUTPUT allow_destructive as _allowed \
  | where isnotnull(_allowed) \
  | stats latest(_time) as _time count by target finding_id title
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.darkmoon_campaign = 1
action.darkmoon_campaign.param.action_kind = retest
action.darkmoon_campaign.param.scope_profile = non-destructive
action.darkmoon_campaign.param.dry_run = 1
action.darkmoon_campaign.param.max_per_hour = 6
description = When a Darkmoon retest reports a regression (a previously fixed finding is back), launch another validation retest.
