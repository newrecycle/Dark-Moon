#
# Custom alert action: "Send to Darkmoon" (Splunk -> Darkmoon).
#
# Offensive-validation loop: a correlation search that detects a security
# condition triggers a Darkmoon retest/campaign against an ALLOWLISTED target.
#
# This is a Pro capability: it calls the Darkmoon Pro REST API (run/campaign or
# retest). The token is read at runtime from Splunk storage/passwords via the
# session key — it is NEVER stored in this .conf.
#
[darkmoon_campaign]
is_custom = 1
label = Send to Darkmoon
description = Trigger a Darkmoon retest/campaign against an allowlisted target (offensive-validation loop). Hard-secured: target allowlist, safe-harbor default, per-target authorized scope, rate limiting, TLS verification.
icon_path = appIcon.png
payload_format = json
python.version = python3
python.required = 3.13
alert.execute.cmd = darkmoon_campaign.py
alert.execute.cmd.arg.1 = --execute

# --- Parameters (rendered by data/ui/alerts/darkmoon_campaign.html) ---
# Target host/URL to (re)test. MUST match a row in the darkmoon_targets lookup.
# Leave empty to take the target from the triggering result field "target"/"dest".
param.target =
# Retest an existing finding/campaign vs launch a fresh campaign: retest|campaign
param.action_kind = retest
# Safe-harbor profile. non-destructive is the enforced default.
param.scope_profile = non-destructive
# Dry-run: validate + log the decision without calling Darkmoon. Default ON.
param.dry_run = 1
# Max launches per hour (token bucket, per app). Hard-capped in the script.
param.max_per_hour = 6
