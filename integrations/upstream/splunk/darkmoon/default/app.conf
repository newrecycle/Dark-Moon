#
# Darkmoon Pentest — Splunk App
# App configuration
#

[id]
name = darkmoon
version = 1.0.0

[install]
is_configured = false
state = enabled
build = 1

[package]
id = darkmoon
check_for_updates = true

[ui]
is_visible = true
label = Darkmoon Pentest
setup_view = darkmoon_setup

[launcher]
author = ASC-IT (SARL) / Darkmoon
version = 1.0.0
description = SOC ingestion for Darkmoon AI pentest results (HEC) plus an offensive-validation loop that triggers a Darkmoon retest/campaign from a Splunk correlation search. Ships CIM-aligned sourcetypes, SOC dashboards, and a hard-secured "Send to Darkmoon" alert action. Events carry safe metadata only — never evidence, secrets, or request/response bodies.

[triggers]
reload.darkmoon = simple
reload.darkmoon_targets = simple
