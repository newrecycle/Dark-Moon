#
# Reusable base searches shared by dashboards and saved/correlation searches.
# Change the index in one place: darkmoon_index.
#

[darkmoon_index]
definition = index=darkmoon OR index=main sourcetype=darkmoon:*
iseval = 0

[darkmoon_findings]
definition = `darkmoon_index` sourcetype=darkmoon:finding
iseval = 0

[darkmoon_findings_by_severity(1)]
args = sev
definition = `darkmoon_index` sourcetype=darkmoon:finding severity="$sev$"
iseval = 0

[darkmoon_open_findings]
definition = `darkmoon_index` sourcetype=darkmoon:finding status IN ("unconfirmed","confirmed","exploited")
iseval = 0

[darkmoon_campaigns]
definition = `darkmoon_index` sourcetype=darkmoon:campaign
iseval = 0

[darkmoon_latest_findings]
definition = `darkmoon_findings` | dedup finding_id sortby -_time
iseval = 0
