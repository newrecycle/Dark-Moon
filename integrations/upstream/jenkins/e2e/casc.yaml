jenkins:
  systemMessage: "Synthetic Jenkins HPI acceptance — no live scans"
  securityRealm: "none"
  authorizationStrategy: "unsecured"
  numExecutors: 0
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "dm-token"
              secret: "SYNTHETIC_ONLY_CREDENTIAL_8e9ffab"
              description: "Disposable native acceptance token"
jobs:
  - script: |
      pipelineJob('darkmoon-native') {
        parameters {
          stringParam('SCENARIO', 'high', 'Synthetic fixture only')
        }
        definition {
          cps {
            sandbox(true)
            script('''
              node('dm-agent') {
                // The driver stages one case in the agent-owned synthetic
                // directory before queueing each real HPI-backed build.
                def scenario = sh(script: "cat '/opt/synthetic data/scenario-native.txt'",
                                  returnStdout: true).trim()
                // Only the remote agent loses the node executable for this
                // case; HPI stays bundled and the controller stays unchanged.
                withEnv(scenario == 'missing_node' ? ['PATH=/usr/bin:/bin'] : []) {
                  def credential = scenario == 'missing_credential' ? 'not-present' : 'dm-token'
                  def command = 'bundled'
                  def failLevel = scenario == 'nonempty_pass' ? 'none' : 'high'
                  def unstableLevel = scenario == 'nonempty_pass' ? 'none' : 'medium'
                  sh 'mkdir -p darkmoon-reports'
                  writeFile file: 'darkmoon-reports/unrelated-sensitive.txt',
                    text: 'SYNTHETIC_UNRELATED_SECRET_DO_NOT_ARCHIVE'
                  darkmoonScan target: 'https://example.invalid', mode: 'oss',
                    failOn: failLevel, unstableOn: unstableLevel,
                    credentialsId: credential, cliPath: command,
                    ossDataDir: '/opt/synthetic data',
                    ossReportsDir: '/opt/synthetic reports',
                    ossScript: '/opt/engine-standin.sh', extraArgs: '--poll 1',
                    timeout: 12, recordIssues: true, archiveReport: true
                  recordIssues(enabledForFailure: true,
                    tools: [sarif(pattern: 'darkmoon-reports/darkmoon.sarif')])
                }
              }
            '''.stripIndent())
          }
        }
      }
