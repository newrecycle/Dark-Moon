services:
  mock-provider:
    image: python:3.13-slim
    working_dir: /tests
    command: ["python3", "/tests/mock_openai_compatible.py"]
    environment:
      MOCK_PROVIDER_CAPTURE: /capture/requests.jsonl
      MOCK_EXPECT_MODEL: deepseek-v4-flash-free
      MOCK_EXPECT_TEMPERATURE: "0.2"
      MOCK_EXPECT_TOP_P: "0.9"
      MOCK_EXPECT_REASONING_EFFORT: medium
    volumes:
      - ./tests:/tests:ro
      - ${DARKMOON_TEST_CAPTURE_DIR:?set DARKMOON_TEST_CAPTURE_DIR}:/capture:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - egress

  opencode:
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_CONFIG_CONTENT: '{"provider":{"opencode":{"models":{"deepseek-v4-flash-free":{"temperature":true,"reasoning":true,"tool_call":true,"variants":{"medium":{"reasoning_effort":"medium"}}}}}},"agent":{"pentest":{"temperature":0.2,"top_p":0.9,"variant":"medium","options":{"id":"must-not-reach-provider","name":"must-not-reach-provider","primary":true,"secondary":false,"prompt_file":"must-not-reach-provider.md","mcp":["darkmoon"],"tools":{"bash":true},"maxSteps":999,"reasoning_effort":"medium"}}}}'
    depends_on:
      mock-provider:
        condition: service_healthy
