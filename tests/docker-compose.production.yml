# Overlay for production integration tests.
#
# The Dark-Moon stack is a single `darkmoon` container with the MCP baked in
# and the LLM brain (Hermes) running outside the container, so there is no
# in-stack OpenCode service or mock provider to override here. This file exists
# only so the production test can layer environment-specific overrides (for
# example capture directories or ARM/local image selection) without editing the
# shipped docker-compose.yml.

services:
  darkmoon:
    # The integration stack must never claim the production plugin container
    # name. The test harness supplies a unique, project-scoped value.
    container_name: ${DARKMOON_TEST_CONTAINER_NAME:?set by test_production_stack.sh}
