name: darkmoon-mcp-test

services:
  darkmoon:
    image: ubuntu:24.04
    container_name: darkmoon
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "bash", "-c", "test -r /etc/os-release && command -v timeout >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20

  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.4.2
    environment:
      CONTAINERS: "1"
      EXEC: "1"
      POST: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  darkmoon-mcp:
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_CONTAINER_NAME: darkmoon
      DARKMOON_MCP_HOST: 0.0.0.0
      DARKMOON_MCP_PORT: "8000"
      DARKMOON_MCP_PATH: /mcp
      DARKMOON_PRIVACY: "0"
      PYTHONUNBUFFERED: "1"
    depends_on:
      darkmoon:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 2s
      timeout: 10s
      start_period: 5s
      retries: 30

  mock-provider:
    image: python:3.13-slim
    working_dir: /tests
    command: ["python3", "/tests/mock_openai_compatible.py"]
    environment:
      MOCK_PROVIDER_CAPTURE: /capture/requests.jsonl
      MOCK_EXPECT_MODEL: darkmoon-test-model
      MOCK_EXPECT_TEMPERATURE: "0.2"
      MOCK_EXPECT_TOP_P: "0.9"
    volumes:
      - ./:/tests:ro
      - ${DARKMOON_TEST_CAPTURE_DIR:?set DARKMOON_TEST_CAPTURE_DIR}:/capture:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30

  opencode:
    image: ghcr.io/anomalyco/opencode:1.18.12
    working_dir: /workspace
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      DARKMOON_MCP_URL: http://darkmoon-mcp:8000/mcp
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      TERM: xterm-256color
      LANG: C.UTF-8
    depends_on:
      darkmoon-mcp:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    volumes:
      - ${DARKMOON_TEST_CONFIG_DIR:?set DARKMOON_TEST_CONFIG_DIR}:/root/.config/opencode:rw
      - ${DARKMOON_TEST_DATA_DIR:?set DARKMOON_TEST_DATA_DIR}:/root/.local/share/opencode:rw
      - ${DARKMOON_TEST_WORKSPACE_DIR:?set DARKMOON_TEST_WORKSPACE_DIR}:/workspace:rw
