name: darkmoon-mcp-test

# Single-container fixture for the Dark-Moon MCP. The merged `darkmoon` image
# bakes the toolbox and the MCP server together and auto-starts it on
# 127.0.0.1:8000/mcp, executing tools locally (DARKMOON_EXEC_MODE=local). There
# is no separate OpenCode brain, docker-proxy, or darkmoon-mcp sidecar: the LLM
# brain (Hermes) runs outside the container. `mock-provider` is kept only as a
# generic provider mock for parity; it is not required by the MCP round-trip.

services:
  darkmoon:
    image: ascit/darkmoon:latest
    # Intentionally omit container_name: the unique Compose project name used by
    # the integration test must own its namespace and never collide with either
    # the production darkmoon-plugin container or an unrelated darkmoon fork.
    network_mode: host
    environment:
      DM_MODE: default
      DARKMOON_EXEC_MODE: local
      DARKMOON_MCP_AUTOSTART: "1"
      DARKMOON_MCP_HOST: 127.0.0.1
      DARKMOON_MCP_PORT: "8000"
      DARKMOON_MCP_PATH: /mcp
    healthcheck:
      test: ["CMD", "bash", "-lc", "cd /opt/darkmoon/mcp/server && python -m src.healthcheck"]
      interval: 2s
      timeout: 10s
      start_period: 10s
      retries: 30

  mock-provider:
    image: python:3.13-slim
    working_dir: /tests
    command: ["python3", "/tests/mock_openai_compatible.py"]
    environment:
      MOCK_PROVIDER_CAPTURE: /capture/requests.jsonl
      MOCK_EXPECT_MODEL: darkmoon-test-model
    volumes:
      - ../tests:/tests:ro
      - ${DARKMOON_TEST_CAPTURE_DIR:?set DARKMOON_TEST_CAPTURE_DIR}:/capture:rw
