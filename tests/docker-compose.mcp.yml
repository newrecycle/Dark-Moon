name: darkmoon-mcp-test

# Single-container fixture for the Dark-Moon MCP. The MCP server is BUILT LOCALLY
# from Dockerfile.mcp (python:3.12-slim + the repo's mcp/ source + pinned deps),
# so the test does NOT depend on the newrecycle/darkmoon toolbox image having the MCP
# baked in. There is no separate OpenCode brain, docker-proxy, or darkmoon-mcp
# sidecar: the LLM brain (Hermes) runs outside the container. The MCP server
# executes tools locally (DARKMOON_EXEC_MODE=local).

services:
  darkmoon:
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    # Intentionally omit container_name: the unique Compose project name used by
    # the integration test must own its namespace and never collide with either
    # the production darkmoon-plugin container or an unrelated darkmoon fork.
    network_mode: host
    environment:
      DM_MODE: default
      DARKMOON_EXEC_MODE: local
      DARKMOON_MCP_AUTOSTART: "1"
      DARKMOON_MCP_HOST: 127.0.0.1
      DARKMOON_MCP_PORT: "8000"
      DARKMOON_MCP_PATH: /mcp
    healthcheck:
      test: ["CMD", "bash", "-lc", "cd /opt/darkmoon/mcp/server && python -m src.healthcheck"]
      interval: 2s
      timeout: 10s
      start_period: 10s
      retries: 30
